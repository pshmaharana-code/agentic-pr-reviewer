services:
  postgres:
    image: postgres:15-alpine
    container_name: gatekeeper_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gatekeeper_user
      POSTGRES_PASSWORD: gatekeeper_password
      POSTGRES_DB: gatekeeper_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gatekeeper_redis
    ports:
      - "6380:6379"

volumes:
  pgdata: